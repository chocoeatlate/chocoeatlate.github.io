<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个大学生的个人主页，关于我、我的大学生活与联系方式。" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>你的名字 · 个人主页</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f6f7f2;
        --surface: #fffefa;
        --text: #263c32;
        --muted: #68776e;
        --accent: #38664e;
        --line: #dce2d8;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-underline-offset: 5px; }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
      .container { width: min(960px, calc(100% - 48px)); margin-inline: auto; }
      .skip-link {
        position: absolute;
        top: -80px;
        left: 24px;
        padding: 8px 16px;
        background: var(--surface);
        z-index: 1;
      }
      .skip-link:focus { top: 12px; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        padding-block: 28px;
        border-bottom: 1px solid var(--line);
      }
      .brand { font-size: 15px; font-weight: 650; text-decoration: none; }
      .brand span { color: var(--accent); margin-right: 9px; }
      nav { display: flex; gap: 26px; font-size: 14px; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a:hover { color: var(--accent); text-decoration: underline; }
      .hero {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 48px;
        padding-block: 84px 72px;
      }
      .eyebrow {
        margin: 0 0 22px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 2px;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 48px);
        font-weight: 650;
        line-height: 1.4;
        letter-spacing: -1px;
      }
      h1 span { color: var(--accent); }
      .intro { margin: 22px 0 28px; color: var(--muted); font-size: 16px; }
      .button {
        display: inline-flex;
        align-items: center;
        gap: 24px;
        padding: 11px 20px;
        border: 1px solid var(--accent);
        border-radius: 7px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        text-decoration: none;
        transition: background 150ms ease;
      }
      .button:hover { background: #294e3a; }
      .portrait {
        display: grid;
        place-items: center;
        width: 184px;
        height: 208px;
        border: 1px solid #d4dfcf;
        border-radius: 92px 92px 24px 24px;
        background: #e8eee1;
        transform: rotate(4deg);
      }
      .portrait svg { width: 112px; height: 112px; transform: rotate(-4deg); }
      .content-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; }
      .card {
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        scroll-margin-top: 24px;
      }
      .section-label { margin: 0 0 6px; color: var(--muted); font-size: 11px; letter-spacing: 2px; }
      h2 { margin: 0 0 22px; font-size: 21px; font-weight: 600; }
      .about-text { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
      dl { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 24px; margin: 0; }
      dt { margin-bottom: 4px; color: var(--muted); font-size: 12px; }
      dd { margin: 0; font-size: 15px; }
      .contact-list { display: grid; gap: 20px; }
      .contact-item { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
      .contact-item:last-child { padding-bottom: 0; border-bottom: 0; }
      .contact-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 12px; }
      .contact-item a { font-size: 15px; overflow-wrap: anywhere; }
      .pending { color: var(--muted); font-size: 14px; }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 64px;
        padding-block: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      footer p { margin: 0; }
      @media (max-width: 640px) {
        .container { width: calc(100% - 36px); }
        header { padding-block: 22px; }
        nav { gap: 18px; }
        .hero { gap: 20px; padding-block: 54px 44px; }
        .portrait { width: 90px; height: 112px; border-radius: 50px 50px 16px 16px; }
        .portrait svg { width: 64px; height: 64px; }
        h1 { font-size: 30px; letter-spacing: -0.5px; }
        .eyebrow { font-size: 10px; letter-spacing: 1px; margin-bottom: 16px; }
        .intro { font-size: 14px; }
        .content-grid { grid-template-columns: 1fr; gap: 18px; }
        .card { padding: 25px; }
        footer { margin-top: 40px; flex-wrap: wrap; }
      }
      @media (max-width: 380px) {
        .hero { grid-template-columns: 1fr; }
        .portrait { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到正文</a>
    <div class="container">
      <header>
        <a class="brand" href="./"><span aria-hidden="true">✳</span>个人主页</a>
        <nav aria-label="主导航">
          <a href="#about">关于我</a>
          <a href="#contact">联系我</a>
        </nav>
      </header>

      <main id="main">
        <section class="hero" aria-labelledby="hello">
          <div>
            <p class="eyebrow">HELLO, WORLD / 你好，世界</p>
            <!-- 将“你的名字”替换为自己的姓名或昵称，同时修改上方的 title。 -->
            <h1 id="hello">你好，<br />我是<span>你的名字</span>。</h1>
            <p class="intro">一名大学生，正在学习、探索与成长。<br />欢迎来到我的个人小站。</p>
            <a class="button" href="#about">认识一下 <span aria-hidden="true">↗</span></a>
          </div>
          <div class="portrait" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none">
              <path d="M60 100V55" stroke="#38664e" stroke-width="4" stroke-linecap="round" />
              <path d="M59 71C30 72 20 53 24 33C46 33 63 46 59 71Z" fill="#9db68d" />
              <path d="M61 54C59 30 75 17 97 19C99 42 83 57 61 54Z" fill="#38664e" />
              <path d="M60 72L37 48M61 54L83 32" stroke="#f6f7f2" stroke-width="2" stroke-linecap="round" />
              <path d="M38 101H82" stroke="#38664e" stroke-width="4" stroke-linecap="round" />
            </svg>
          </div>
        </section>

        <div class="content-grid">
          <section class="card" id="about" aria-labelledby="about-title">
            <p class="section-label">ABOUT ME</p>
            <h2 id="about-title">关于我</h2>
            <p class="about-text">这里是我在互联网上的一小块空间，用来介绍自己，也慢慢记录大学生活中的点滴。</p>
            <!-- 在这里填写你的真实信息。 -->
            <dl>
              <div><dt>学校</dt><dd>你的大学</dd></div>
              <div><dt>专业</dt><dd>你的专业</dd></div>
              <div><dt>年级</dt><dd>你的年级</dd></div>
              <div><dt>兴趣</dt><dd>你的兴趣爱好</dd></div>
            </dl>
          </section>

          <section class="card" id="contact" aria-labelledby="contact-title">
            <p class="section-label">GET IN TOUCH</p>
            <h2 id="contact-title">联系我</h2>
            <p class="about-text">很高兴与你相遇，欢迎交流。</p>
            <div class="contact-list">
              <div class="contact-item">
                <span class="contact-label">GitHub</span>
                <!-- 根据当前仓库名称填写；如用户名不同，请修改链接和文字。 -->
                <a href="https://github.com/chocoeatlate">github.com/chocoeatlate <span aria-hidden="true">↗</span></a>
              </div>
              <div class="contact-item">
                <span class="contact-label">邮箱</span>
                <!-- 填写邮箱后可改为 <a href="mailto:你的邮箱">你的邮箱</a>。 -->
                <span class="pending">待补充</span>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer>
        <p>© 2026 你的名字</p>
        <p>保持好奇，慢慢生长。🌱</p>
      </footer>
    </div>
  </body>
</html>
