    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",

        color: #252525;
        background: #fff;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      main {
        width: min(900px, calc(100% - 48px));
        margin: 72px auto;
        font-size: 17px;
        line-height: 1.9;
        overflow-wrap: anywhere;
      }

      h1 {

        font-weight: 500;
        line-height: 1.3;
      }

      dl { margin: 0 0 24px; }
      dl > div { display: flex; gap: 16px; margin-bottom: 6px; }
      dt { flex: 0 0 3em; color: #555; }
      dd { margin: 0; min-width: 0; }

      .introduction { margin: 0 0 24px; }

      address {
        padding-top: 22px;
        border-top: 1px solid #ddd;
        font-style: normal;
      }
      address p { margin: 0 0 6px; }

      a { color: #1768a6; text-decoration: none; }
      a:hover { text-decoration: underline; text-underline-offset: 3px; }
      a:focus-visible { outline: 2px solid #1768a6; outline-offset: 4px; }

      @media (max-width: 600px) {
        main { width: calc(100% - 40px); margin-block: 40px; font-size: 16px; }
        h1 { font-size: 32px; margin-bottom: 24px; }
      }
    </style>
